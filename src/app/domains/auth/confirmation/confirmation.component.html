<div class="flex w-full justify-center p-3">
  <!-- card -->
  <div class="w-full rounded-lg p-4 md:w-1/2 lg:w-1/3">
    <!-- title -->
    <div class="mb-8 mt-4 text-xl font-bold">Confirmation Required</div>

    <!-- Info -->
    <section class="flex flex-col justify-center">
      <!-- email -->
      <p>
        Confirmation required, you need to confirm your address email to
        continue, please check your inbox 📩.
      </p>

      <!-- redirects  -->
      <div class="flex flex-row justify-end">
        <button mat-button [routerLink]="['/', 'auth', 'login']">
          Login
        </button>
      </div>
    </section>
  </div>
</div>
